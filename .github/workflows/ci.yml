name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          # Throwaway container that only lives for this job; not a real secret.
          MSSQL_SA_PASSWORD: CiTest!Passw0rd
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'CiTest!Passw0rd' -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NEXTTRAIN_TEST_DB: Server=localhost,1433;Database=NextTrainDb_Tests;User Id=sa;Password=CiTest!Passw0rd;TrustServerCertificate=True;

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - run: dotnet build NextTrain.slnx

      - run: dotnet test NextTrain.slnx --no-build

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: NextTrain.Web/package-lock.json

      - name: Web lint, test, build
        working-directory: NextTrain.Web
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: TestFlight script tests
        run: node --test ".github/scripts/*.test.mjs"

  # Compiles the iPhone app and its Live Activity extension (unsigned), so Swift or Xcode project mistakes show up
  # here instead of in a TestFlight upload. Free on GitHub's Mac runners for public repositories.
  ios-build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: NextTrain.Web/package-lock.json

      - name: Build the iPhone app
        working-directory: NextTrain.Web
        run: |
          npm ci
          npm run ios
          xcodebuild build -quiet -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/build" CODE_SIGNING_ALLOWED=NO
          # The Live Activity extension must be built and embedded in the app.
          app="$RUNNER_TEMP/build/Build/Products/Release-iphoneos/App.app"
          plutil -p "$app/PlugIns/LiveActivity.appex/Info.plist" | grep -E 'NSExtensionPointIdentifier|CFBundleIdentifier'
          plutil -p "$app/Info.plist" | grep NSSupportsLiveActivities
