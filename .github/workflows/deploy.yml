name: Deploy

# After CI passes on main: the API goes to Azure Container Apps (image on GitHub's registry, ghcr.io) and the web app
# to Azure Static Web Apps. Azure login is OIDC (no stored password): AZURE_CLIENT_ID, AZURE_TENANT_ID and
# AZURE_SUBSCRIPTION_ID are repository variables, SWA_DEPLOY_TOKEN is a repository secret, API_URL is the API's address.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  RESOURCE_GROUP: nexttrain-rg
  CONTAINER_APP: nexttrain-api
  IMAGE: ghcr.io/${{ github.repository_owner }}/nexttrain-api

jobs:
  api:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - run: az containerapp update -g $RESOURCE_GROUP -n $CONTAINER_APP --image $IMAGE:${{ github.event.workflow_run.head_sha || github.sha }}

  web:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: NextTrain.Web/package-lock.json

      - name: Build
        working-directory: NextTrain.Web
        env:
          VITE_API_URL: ${{ vars.API_URL }}
        run: |
          npm ci
          npm run build

      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOY_TOKEN }}
          action: upload
          app_location: NextTrain.Web/dist
          skip_app_build: true
          skip_api_build: true
