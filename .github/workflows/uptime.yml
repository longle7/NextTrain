name: Uptime

# Every 15 minutes during service hours: is NextTrain up for riders? Checks that the API is healthy (its database
# answers), that it answers with routes (so MBTA is reachable through it), and that the website loads. A failed check
# fails the run, and GitHub emails the repository owner about failed scheduled runs. Free for public repositories.
# GitHub may start a scheduled run a few minutes late, and pauses schedules after 60 days without commits.
# Not 06:00-09:59 UTC (about 2-6 AM Eastern, 1-5 AM in winter): the API may sleep then, and a check would only wake it.

on:
  schedule:
    - cron: '*/15 0-5,10-23 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API: ${{ vars.API_URL }}
      SITE: https://nexttrain.longledev.com
    steps:
      # Retries ride out a blip (a container restarting, a slow cold start) so one hiccup doesn't page you.
      - name: API is healthy
        run: curl --fail --silent --show-error --max-time 20 --retry 3 --retry-delay 20 --retry-all-errors "$API/health"

      - name: API answers with routes
        run: |
          count=$(curl --fail --silent --show-error --max-time 30 --retry 3 --retry-delay 20 --retry-all-errors "$API/routes?type=all" | jq length)
          echo "$count routes"
          test "$count" -gt 100 || { echo "::error::The API answered with $count routes; expected 150+ (subway and bus)."; exit 1; }

      - name: Website loads
        run: curl --fail --silent --show-error --max-time 20 --retry 3 --retry-delay 20 --retry-all-errors --output /dev/null "$SITE/"
