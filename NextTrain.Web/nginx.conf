server {
    listen 80;
    root /usr/share/nginx/html;

    # /api/stations -> http://api:8080/stations (trailing slash strips the /api prefix)
    location /api/ {
        proxy_pass http://api:8080/;
    }

    # Client-side routes (/lines/Red, /stations/place-pktrm) all serve the React app.
    location / {
        try_files $uri /index.html;
    }
}
