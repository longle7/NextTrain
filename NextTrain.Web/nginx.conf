server {
    listen 80;
    root /usr/share/nginx/html;

    # Re-resolve the api container via Docker's DNS so an API restart (new IP) doesn't leave nginx returning 502.
    resolver 127.0.0.11 valid=10s;
    set $api http://api:8080;

    # /api/stations -> http://api:8080/stations
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
    }

    # Client-side routes (/lines/Red, /stations/place-pktrm) all serve the React app.
    location / {
        try_files $uri /index.html;
    }
}
